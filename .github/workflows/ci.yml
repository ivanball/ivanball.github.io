name: CI

# Pushing to main publishes the live site, so these checks exist to catch a bad
# push before it is served rather than after. The freshness job is the important
# one: everything under docs/ plus sitemap.xml, feed.xml, and the marked regions
# of the root pages is generated, and keeping it in step with docs-src/ used to
# rest entirely on remembering to run the build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Generated output is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # <lastmod> in sitemap.xml comes from each file's last commit date, so a
          # shallow clone would rewrite every entry and fail the diff for no reason.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      # Skips the puppeteer browser download; this job only runs the generator.
      - run: npm ci
        working-directory: tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Fails on its own if a BEGIN/END marker went missing or a scorecard index
      # stopped parsing, both of which throw rather than silently no-op.
      - name: Rebuild the reference library
        run: npm run build
        working-directory: tools

      # One exemption, and it is deliberately narrow. sitemap lastmod comes from each file's last
      # commit date, so a squash merge re-dates every file the PR touched to the merge commit's day.
      # A PR built on one UTC day and merged on a later one therefore lands with a sitemap that is
      # a day behind, through no fault of the author: the squash date does not exist until the merge
      # is pressed, so the branch cannot pre-empt it. That skew has reddened main four times
      # (2026-08-02, 08-05, 09-17, 09-19), each time costing a follow-up PR that only restamped dates.
      #
      # Exempting it is safe because genuine staleness cannot hide in this shape. A content edit that
      # was not rebuilt changes the rendered HTML under docs/, and an added, removed or moved page
      # changes a <loc> entry; both fall outside the exemption and still fail. The exemption requires
      # BOTH that sitemap.xml is the only changed file AND that every changed line within it is
      # nothing but a <lastmod> element. The whole-line match is the load-bearing part: a rule that
      # merely ignored lines containing <lastmod> would also wave through a <loc> edit that shared a
      # line with one, which is exactly how the first draft of this step was wrong.
      - name: Check nothing changed
        run: |
          if git diff --exit-code --quiet; then
            echo "Generated output is current."
            exit 0
          fi

          changed=$(git diff --name-only)
          lines=$(git diff -U0 -- sitemap.xml | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
          if [ -z "$lines" ]; then
            offending=1
          else
            offending=$(printf '%s\n' "$lines" \
              | grep -cvE '^[+-][[:space:]]*<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>[[:space:]]*$' || true)
          fi

          if [ "$changed" = "sitemap.xml" ] && [ "$offending" = "0" ]; then
            git diff --stat -- sitemap.xml
            echo "::notice::sitemap.xml lastmod drift only; treating as a squash-merge date skew, not stale output."
            exit 0
          fi

          git diff --stat
          echo "::error::Generated output is stale. Run 'cd tools && npm run build' and commit the result."
          exit 1

  links:
    name: Internal links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # http-server rather than a simpler static server: linkinator crawls
      # concurrently and a single-threaded server drops connections, which is
      # reported as BROKEN on files that are perfectly fine.
      - name: Serve
        run: |
          npx --yes http-server . -p 8080 --silent &
          npx --yes wait-on http://127.0.0.1:8080/index.html

      # Pointed at the directory root, not index.html: linkinator only recurses
      # into URLs beneath the entry point's own path.
      # Internal links are this repo's own responsibility and must resolve.
      - name: Check internal links
        run: npx --yes linkinator@6 http://127.0.0.1:8080/ --recurse --skip "^https://" --format csv

      # Same crawl without the skip, so outbound links get checked too. External
      # links break for reasons outside this repo (rate limits, sites that block
      # CI egress), so this reports but never fails the build.
      - name: Check external links (advisory)
        continue-on-error: true
        run: npx --yes linkinator@6 http://127.0.0.1:8080/ --recurse --format csv

  adr-index:
    name: ADR index matches the files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docs-src/adr/README.md is the declared owner of the ADR count and range
      # (MMCA.Common/FACTS.md), so the claim has to be machine-checked: the script
      # re-derives both from the files and fails on a stale count, a missing row,
      # a duplicate number, a gap, or a row pointing at the wrong file.
      # pwsh is preinstalled on ubuntu-latest.
      - name: Check the ADR index
        run: pwsh tools/adr-index.ps1 -Quiet

  a11y:
    name: Accessibility (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - run: npm ci
        working-directory: tools

      - name: Serve
        run: |
          npx --yes http-server . -p 8080 --silent &
          npx --yes wait-on http://127.0.0.1:8080/index.html

      # axe-core through puppeteer, every page type in both themes.
      # See tools/a11y-check.mjs for why not pa11y-ci.
      - name: Run axe-core
        run: npm run a11y
        working-directory: tools
        env:
          PORT: "8080"
